name: Multilingual build validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - run: npx vitest run lib/demo-classrooms.test.ts tests/virtual-labs.test.ts
