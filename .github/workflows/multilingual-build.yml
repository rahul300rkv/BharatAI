name: Multilingual build validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm install --legacy-peer-deps
      - name: Dependency vulnerability report
        if: always()
        run: |
          npm audit --json > npm-audit.json || true
          npm audit --omit=dev --json > npm-audit-production.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: npm-audit*.json
      - run: npm run build
      - run: npx vitest run lib/demo-classrooms.test.ts tests/virtual-labs.test.ts
